[package]
name = "mcpmonitor"
version = "3.1.4"
edition = "2024"
license = "MIT"
description = "Standalone HTTP MCP observation and user input dashboard"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "form"] }
sha2 = "0.11.0"
rand = "0.10.3"
base64 = "0.23.1"
subtle = "2.6.1"
url = "2.5.8"
async-stream = "0.3.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
web-push = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
