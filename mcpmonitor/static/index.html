<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>mcpmonitor</title>
    <link rel="stylesheet" href="/mcpmonitor/app.css?v=ui-motion-20260929" />
    <script src="/mcpmonitor/app.js?v=cua-count-20260922" defer></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" id="sidebar">
        <div
          class="sidebar-resizer"
          id="sidebar-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整日志面板宽度"
          tabindex="0"
        ></div>
        <header class="sidebar-head mobile-only">
          <button class="icon-button mobile-only" id="close-sidebar" aria-label="关闭侧栏"
            >×</button
          >
        </header>

        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="搜索调用"
            aria-label="搜索工具调用"
          />
          <kbd>/</kbd>
        </label>

        <div class="session-stats" id="session-stats" aria-label="会话统计">
          <span class="session-stat session-files"
            ><strong id="stat-files">0</strong><small>文件</small
            ><b class="stat-add" id="stat-additions">+0</b
            ><b class="stat-remove" id="stat-deletions">-0</b></span
          >
          <span class="session-stat"><strong id="stat-commands">0</strong><small>命令</small></span>
          <span class="session-stat"
            ><strong id="stat-browser">0</strong><small>CUA</small></span
          >
          <span class="session-stat"><strong id="stat-tools">0</strong><small>工具</small></span>
        </div>

        <div class="filter-bar">
          <div class="filters" role="group" aria-label="调用筛选">
            <button class="filter active" data-filter="all">全部</button>
            <button class="filter" data-filter="exec_command">Shell</button>
            <button class="filter" data-filter="apply_patch">编辑</button>
            <button class="filter" data-filter="view_image">图像</button>
            <button class="filter" data-filter="write_stdin">输入</button>
            <button class="filter" data-filter="browser">CUA</button>
          </div>
          <button
            class="calendar-button"
            id="time-filter"
            type="button"
            aria-label="选择时间区间"
            aria-expanded="false"
            title="时间区间：最近 24 小时"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5.5" width="17" height="15" rx="2.5" />
              <path d="M8 3.5v4M16 3.5v4M3.5 9.5h17" />
            </svg>
          </button>
          <div class="time-popover hidden" id="time-popover" role="group" aria-label="时间区间">
            <div class="time-popover-title">时间区间</div>
            <div class="range-filters">
              <button class="range-filter" data-range="1d" title="今天 00:00 至今">1d</button>
              <button class="range-filter active" data-range="24h" title="最近 24 小时">24h</button>
              <button class="range-filter" data-range="3d" title="最近 3 天">3d</button>
              <button class="range-filter" data-range="7d" title="最近 7 天">7d</button>
              <button class="range-filter" data-range="1m" title="最近 1 个月">1m</button>
              <button class="range-filter" data-range="all" title="全部保留记录">all</button>
            </div>
            <div class="custom-range">
              <div class="time-popover-title custom-range-title">自选日期</div>
              <label class="custom-date-field">
                <span>开始</span>
                <input id="custom-date-start" type="date" aria-label="开始日期" />
              </label>
              <label class="custom-date-field">
                <span>结束</span>
                <input id="custom-date-end" type="date" aria-label="结束日期" />
              </label>
              <div class="custom-range-actions">
                <span class="custom-range-error" id="custom-range-error" role="alert"></span>
                <button class="custom-range-apply" id="custom-range-apply" type="button"
                  >应用</button
                >
              </div>
            </div>
          </div>
        </div>
        <div
          class="pinned-call-list hidden"
          id="pinned-call-list"
          aria-label="待回答调用"
        ></div>
        <div class="scroll-shell sidebar-scroll-shell">
          <div class="list-sync hidden" id="list-sync" aria-live="polite">
            <div
              class="list-sync-track"
              id="list-sync-progress"
              role="progressbar"
              aria-label="调用列表同步进度"
              aria-valuemin="0"
              aria-valuemax="100"
            >
              <span class="list-sync-bar" id="list-sync-bar"></span>
            </div>
            <span class="list-sync-label" id="list-sync-label"></span>
          </div>
          <nav class="call-list custom-scroll-host" id="call-list" aria-label="工具调用列表"></nav>
          <div class="custom-scrollbar" aria-hidden="true"
            ><div class="custom-scrollbar-thumb"></div
          ></div>
        </div>

        <footer class="sidebar-foot">
          <div class="connection-line">
            <span class="signal" id="signal"></span>
            <span id="connection-text">正在连接</span>
            <button class="icon-button" id="reconnect" aria-label="重新连接" title="重新连接"
              >↻</button
            >
          </div>
          <div class="foot-actions">
            <button class="text-button" id="follow" aria-pressed="true">跟随最新</button>
            <button class="text-button" id="theme">主题</button>
            <button class="text-button" id="notifications" type="button" title="系统通知"
              >通知</button
            >
            <select class="zoom-select" id="zoom" aria-label="页面缩放" title="页面缩放">
              <option value="100">100%</option>
              <option value="125">125%</option>
              <option value="150">150%</option>
              <option value="175">175%</option>
              <option value="200">200%</option>
              <option value="225">225%</option>
              <option value="250">250%</option>
              <option value="300">300% (推荐)</option>
              <option value="350">350%</option>
            </select>
            <button class="text-button" id="logout">退出</button>
          </div>
        </footer>
      </aside>

      <button
        class="sidebar-reveal"
        id="sidebar-reveal"
        type="button"
        aria-label="显示工具调用列表"
        aria-expanded="false"
        title="显示工具调用列表"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2.5" />
          <path d="M9 4.5v15" />
          <path d="m12 9 3 3-3 3" />
        </svg>
      </button>

      <main class="main" id="main-pane">
        <header class="topbar">
          <div class="topbar-left">
            <button class="icon-button mobile-only" id="open-sidebar" aria-label="打开调用列表"
              >☰</button
            >
            <span class="crumb">codex-mcp</span>
            <span class="slash">/</span>
            <span id="selected-index">—</span>
          </div>
          <div class="topbar-right">
            <span id="selected-status" class="status-badge hidden"></span>
            <button
              class="main-toggle"
              id="main-toggle"
              type="button"
              aria-label="收起详情面板"
              aria-expanded="true"
              title="收起详情面板"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 5v14" />
                <path class="main-toggle-arrow main-toggle-arrow-collapse" d="m9 6 6 6-6 6" />
                <path class="main-toggle-arrow main-toggle-arrow-expand" d="m15 6-6 6 6 6" />
              </svg>
            </button>
          </div>
        </header>

        <div class="banner hidden" id="banner" role="status"></div>
        <div class="scroll-shell detail-scroll-shell">
          <section class="detail custom-scroll-host" id="detail">
            <div class="empty-state"><span>⌘</span><strong>暂无工具调用</strong></div>
          </section>
          <div class="custom-scrollbar" aria-hidden="true"
            ><div class="custom-scrollbar-thumb"></div
          ></div>
        </div>
      </main>

      <aside class="browser-panel collapsed" id="browser-panel" aria-label="Video Monitor">
        <div
          class="browser-resizer"
          id="browser-resizer"
          role="separator"
          aria-orientation="vertical"
          aria-label="调整 Video Monitor 宽度"
          tabindex="0"
        ></div>
        <button
          class="browser-rail"
          id="browser-toggle"
          type="button"
          aria-expanded="false"
          title="打开 Video Monitor"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <path d="M3 8.5h18M7 6.25h.01M10 6.25h.01" />
          </svg>
          <span>视频</span>
          <i class="browser-rail-signal" id="browser-rail-signal"></i>
        </button>
        <button
          class="video-monitor-collapse"
          id="browser-hide"
          type="button"
          aria-label="收起 Video Monitor"
          title="收起 Video Monitor"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.5 5.5 16 12l-6.5 6.5" />
            <path d="M5 5.5v13" />
          </svg>
        </button>
        <div class="browser-console" id="browser-console">
          <div class="browser-stage" id="browser-stage" aria-label="远程画面">
            <div
              class="surface-control-zone browser-surface-control-zone"
              id="browser-surface-control-zone"
              aria-hidden="false"
            >
              <div class="surface-controls browser-surface-controls" id="browser-surface-controls">
                <span
                  class="surface-control-label"
                  data-surface-control-drag="browser"
                  title="拖动 Browser 控件"
                  ><i class="surface-control-signal" id="browser-surface-signal"></i>Browser</span
                >
                <button
                  class="browser-icon-button browser-audio-button"
                  id="browser-audio-toggle"
                  type="button"
                  aria-label="浏览器声音"
                  aria-pressed="true"
                  title="浏览器声音"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 9v6h4l5 4V5L8 9H4z" />
                    <path
                      class="browser-audio-wave"
                      d="M16 8.2c1 .9 1.6 2.2 1.6 3.8S17 14.9 16 15.8M18.8 5.6c1.7 1.7 2.7 3.8 2.7 6.4s-1 4.8-2.7 6.4"
                    />
                  </svg>
                </button>
                <button
                  class="browser-icon-button"
                  id="browser-process-refresh"
                  type="button"
                  aria-label="刷新 Browser"
                  title="刷新 Browser"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0-2.3 5.7" />
                    <path d="M20 4v7h-7" />
                  </svg>
                </button>
                <button
                  class="browser-icon-button surface-switch-button hidden"
                  id="browser-switch-surface"
                  type="button"
                  aria-label="切换到 Native"
                  title="切换到 Native"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 7h12" />
                    <path d="m15 4 3 3-3 3" />
                    <path d="M18 17H6" />
                    <path d="m9 20-3-3 3-3" />
                  </svg>
                </button>
                <button
                  class="browser-icon-button surface-view-toggle"
                  id="browser-view-toggle"
                  type="button"
                  aria-label="最大化 Browser"
                  title="最大化 Browser"
                >
                  <svg class="surface-maximize-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />
                  </svg>
                  <svg class="surface-minimize-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" />
                  </svg>
                </button>
              </div>
            </div>
            <div
              class="surface-control-zone native-surface-control-zone"
              id="native-surface-control-zone"
              aria-hidden="false"
            >
              <div class="surface-controls native-surface-controls" id="native-surface-controls">
                <span
                  class="surface-control-label"
                  data-surface-control-drag="native"
                  title="拖动 Native 控件"
                  ><i class="surface-control-signal" id="native-surface-signal"></i>Native</span
                >
                <button
                  class="browser-icon-button"
                  id="native-process-refresh"
                  type="button"
                  aria-label="刷新 Native"
                  title="刷新 Native"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 11a8 8 0 1 0-2.3 5.7" />
                    <path d="M20 4v7h-7" />
                  </svg>
                </button>
                <button
                  class="browser-icon-button"
                  id="native-relative"
                  type="button"
                  aria-label="Native 相对鼠标（Ctrl+Alt+Shift+Z）"
                  aria-pressed="false"
                  title="捕获/弹出鼠标 · Ctrl+Alt+Shift+Z"
                >
                  <svg class="native-relative-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5" />
                    <circle cx="12" cy="12" r="4.25" />
                    <circle class="native-relative-dot" cx="12" cy="12" r="1" />
                  </svg>
                </button>
                <button
                  class="browser-icon-button surface-switch-button hidden"
                  id="native-switch-surface"
                  type="button"
                  aria-label="切换到 Browser"
                  title="切换到 Browser"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 7h12" />
                    <path d="m15 4 3 3-3 3" />
                    <path d="M18 17H6" />
                    <path d="m9 20-3-3 3-3" />
                  </svg>
                </button>
                <button
                  class="browser-icon-button surface-view-toggle"
                  id="native-view-toggle"
                  type="button"
                  aria-label="最大化 Native"
                  title="最大化 Native"
                >
                  <svg class="surface-maximize-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" />
                  </svg>
                  <svg class="surface-minimize-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" />
                  </svg>
                </button>
              </div>
            </div>
            <div class="remote-stack" id="remote-stack">
              <section
                class="remote-surface browser-surface"
                id="browser-surface"
                tabindex="-1"
                aria-label="浏览器画面"
              >
                <div id="browser-video-input" class="browser-video-input" aria-hidden="true"></div>
                <textarea
                  id="browser-input-sink"
                  class="browser-input-sink"
                  aria-label="浏览器键盘输入"
                  tabindex="-1"
                  inputmode="text"
                  enterkeyhint="enter"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="none"
                  spellcheck="false"
                ></textarea>
                <img
                  id="browser-agent-cursor"
                  class="browser-agent-cursor"
                  src="/mcpmonitor/codex-pointer.svg"
                  alt=""
                  aria-hidden="true"
                  draggable="false"
                />
                <div class="browser-placeholder" id="browser-placeholder">
                  <span>◎</span><strong>正在连接浏览器</strong>
                </div>
              </section>
              <section
                class="remote-surface native-surface"
                id="native-surface"
                tabindex="0"
                aria-label="Native 桌面画面"
              >
                <div id="native-cursor-overlay" class="native-cursor-overlay" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                    <path d="M3 2.5 18.8 14l-7.4 1.1 4.2 6.4-3.5 2.1-4.1-6.4L3 22Z" />
                  </svg>
                </div>
                <div class="browser-placeholder" id="native-placeholder">
                  <span>◎</span><strong>正在连接 Native</strong>
                </div>
              </section>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
  </body>
</html>
