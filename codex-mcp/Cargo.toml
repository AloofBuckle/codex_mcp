[package]
name = "codex-mcp"
version = "3.1.2"
edition = "2024"
license = "Apache-2.0"

[workspace]
members = ["vendor/*"]
[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
[workspace.lints]

[workspace.lints.clippy]
# Rust 1.98 promotes this new style lint under `-D warnings`, while the
# tracked Codex upstream still intentionally uses chunks_exact(2).
chunks_exact_to_as_chunks = "allow"

[workspace.dependencies]
anyhow = "1"
assert_matches = "1.5.0"
base64 = "0.22.1"
codex-utils-absolute-path = { path = "vendor/codex-utils-absolute-path" }
codex-utils-cache = { path = "vendor/codex-utils-cache" }
codex-utils-path-uri = { path = "vendor/codex-utils-path-uri" }
dirs = "6"
divan = "0.1.21"
dunce = "1.0.4"
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lazy_static = "1"
libc = "0.2.182"
log = "0.4"
lru = "0.18.2"
mcpx-local-fs = { path = "vendor/mcpx-local-fs" }
mime_guess = "2.0.5"
portable-pty = "0.9.0"
pretty_assertions = "1.4.1"
regex-lite = "0.1.8"
schemars = "0.8.22"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
sha1 = "0.10.6"
similar = "2.7.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ts-rs = "11"
url = "2"
urlencoding = "2.1"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
base64.workspace = true
argon2 = "0.5"
url = "2"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
codex-utils-string = { path = "vendor/codex-utils-string" }
codex-utils-image = { path = "vendor/codex-utils-image" }
codex-utils-pty = { path = "vendor/codex-utils-pty" }
codex-apply-patch = { path = "vendor/codex-apply-patch" }
codex-utils-path-uri.workspace = true
mcpx-local-fs.workspace = true
which = "8"
regex = "1"
image.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

[dev-dependencies]
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = "thin"
strip = true
